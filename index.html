<!doctype html>
<html lang="en">
  <head>
    <!-- ================================
         BASIC
    ================================= -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ================================
         GOOGLE SEARCH CONSOLE
    ================================= -->
    <meta
      name="google-site-verification"
      content="GBg4DA_wPbHdUmRb9k4mqsswsoTpsSu75Dg_VwXkNdg"
    />

    <!-- ================================
         PRIMARY SEO
    ================================= -->
    <title>
      KSquare Softtech | Web Development & IT Solutions
    </title>

    <meta
      name="description"
      content="KSquare Softtech provides web development, app development, full stack development, digital marketing, data science and IT solutions."
    />

    <meta
      name="keywords"
      content="KSquare Softtech, web development, app development, full stack development, MERN, digital marketing, data science, IT solutions, software development"
    />

    <meta
      name="author"
      content="KSquare Softtech"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.ksquaresofttech.org/"
    />

    <!-- ================================
         THEME / APP
    ================================= -->
    <meta
      name="theme-color"
      content="#2563EB"
    />

    <meta
      name="application-name"
      content="KSquare Softtech"
    />

    <!-- ================================
         FAVICON
    ================================= -->
    <link
      rel="icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.jpeg"
    />

    <!-- ================================
         MANIFEST
    ================================= -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- ================================
         OPEN GRAPH / SOCIAL SHARING
    ================================= -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="KSquare Softtech | Web Development & IT Solutions"
    />

    <meta
      property="og:description"
      content="KSquare Softtech provides web development, app development, full stack development, digital marketing, data science and IT solutions."
    />

    <meta
      property="og:url"
      content="https://www.ksquaresofttech.org/"
    />

    <meta
      property="og:site_name"
      content="KSquare Softtech"
    />

    <meta
      property="og:image"
      content="https://www.ksquaresofttech.org/logo.jpeg"
    />

    <meta
      property="og:image:alt"
      content="KSquare Softtech Logo"
    />

    <!-- ================================
         TWITTER / X
    ================================= -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KSquare Softtech | Web Development & IT Solutions"
    />

    <meta
      name="twitter:description"
      content="KSquare Softtech provides web development, app development, full stack development, digital marketing, data science and IT solutions."
    />

    <meta
      name="twitter:image"
      content="https://www.ksquaresofttech.org/logo.jpeg"
    />

    <!-- ================================
         FONTS
    ================================= -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ================================
         ORGANIZATION SCHEMA
    ================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KSquare Softtech",
        "url": "https://www.ksquaresofttech.org/",
        "logo": "https://www.ksquaresofttech.org/logo.jpeg",
        "description": "KSquare Softtech provides web development, app development, full stack development, digital marketing, data science and IT solutions.",
        "sameAs": []
      }
    </script>

    <!-- ================================
         WEBSITE SCHEMA
    ================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KSquare Softtech",
        "url": "https://www.ksquaresofttech.org/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
